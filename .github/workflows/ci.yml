name: CI

on:
  push:
    branches:
      - main
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Node.js ${{ matrix.node-version }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        node-version:
          - 26.3.0
          - 26.x

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ matrix.node-version }}

      - name: Install development dependencies
        run: npm ci

      - name: Test
        run: npm test

      - name: Verify published TypeScript declarations
        run: npm run test:types

      - name: Verify package contents
        run: |
          npm pack --dry-run --json > "$RUNNER_TEMP/package.json"
          node --input-type=module <<'EOF'
          import assert from 'node:assert/strict'
          import fs from 'node:fs'

          const [pack] = JSON.parse(fs.readFileSync(`${process.env.RUNNER_TEMP}/package.json`, 'utf8'))
          const actual = pack.files.map(({ path }) => path).sort()
          const expected = [
            'LICENSE',
            'README.md',
            'docs/deferred-capabilities.md',
            'docs/error-values.md',
            'docs/module-dependencies.md',
            'docs/one-shot-pooling.md',
            'docs/vercel-labs-run-comparison.md',
            'docs/worker-admission.md',
            'package.json',
            'src/admission.js',
            'src/host-functions.js',
            'src/index.d.ts',
            'src/index.js',
            'src/internal.js',
            'src/session.js'
          ]
          assert.deepEqual(actual, expected)
          EOF
